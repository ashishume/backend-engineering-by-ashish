  # Client (React Frontend)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - "5173:5173"
    environment:
      - VITE_AUTH_SERVICE_URL=http://localhost:8000
      - VITE_BOOKING_SERVICE_URL=http://localhost:8003
      - VITE_AI_AGENT_API_URL=http://localhost:8001
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - microservices-network
    restart: unless-stopped

  # RAG Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - microservices-network
    restart: unless-stopped

  # AI Agent RAG Service
  ai-agent-db:
    image: postgres:16-alpine
    container_name: ai-agent-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ai_agent
    ports:
      - "5439:5432"
    volumes:
      - ai-agent-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network
    restart: unless-stopped

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: ai-agent
    ports:
      - "8001:8001"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_HTTP_REFERER: http://localhost:5173
      OPENROUTER_APP_TITLE: Backend Engineering RAG
      CHAT_MODEL: openai/gpt-4o-mini
      EMBEDDING_MODEL: openai/text-embedding-3-small
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rag_documents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ai_agent
      POSTGRES_HOST: ai-agent-db
      POSTGRES_PORT: 5432
      MEMORY_TOKEN_LIMIT: 6000
      MEMORY_RECENT_MESSAGES_LIMIT: 24
    depends_on:
      qdrant:
        condition: service_started
      ai-agent-db:
        condition: service_healthy
    volumes:
      - ./ai-agent:/app
    networks:
      - microservices-network
    restart: unless-stopped

